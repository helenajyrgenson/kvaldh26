<!doctype html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elurõõmus Auto Linnas 🚗💨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #f59e0b, #ef4444, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.2);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #334155;
            background-color: #000;
            cursor: pointer;
        }

        canvas {
            display: block;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background: #334155;
            transform: translateY(-2px);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        button:active {
            transform: translateY(0);
        }

        .tip {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .tip kbd {
            background: #334155;
            color: #f1f5f9;
            padding: 2px 7px;
            border-radius: 6px;
            font-family: monospace;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚗 Elurõõmus Auto Suvises Linnas</h1>
        <p class="subtitle">Tänav, värvid, liikuv muusika, lehvitav juht ja rõõmus jalakäija!</p>
    </header>

    <div class="canvas-container" onclick="tuutu()" title="Klõpsa signaali andmiseks!">
        <canvas id="tahvel" width="850" height="460"></canvas>
    </div>

    <div class="controls">
        <button onclick="tuutu()">📢 Anna signaali! (TÖÖT!)</button>
        <button onclick="muudaKiirust()">⚡ Kiirus: <span id="kiirusTekst">Normaalne</span></button>
        <button onclick="vahetaReziimi()">🌓 Päev / Öö režiim</button>
        <button onclick="vahetaAutoVarvi()">🎨 Vaheta auto värvi</button>
    </div>

    <p class="tip">💡 <strong>Nipp:</strong> Vajuta pildile või klaviatuuril <kbd>TÜHIKUT</kbd>, et tuututada ja gaasi anda!</p>

    <script>
        const canvas = document.getElementById("tahvel");
        const g = canvas.getContext("2d");

        // Olekumuutujad
        let t = 0;
        let kiirus = 5;
        let onOo = false;
        let signaalTaimer = 0;
        let autoVarvIndex = 0;
        const autoVarvid = [
            { kere: "#ef4444", vari: "#b91c1c", nimi: "Erkpunane" },
            { kere: "#3b82f6", vari: "#1d4ed8", nimi: "Elektrisinine" },
            { kere: "#10b981", vari: "#047857", nimi: "Mürkroheline" },
            { kere: "#f59e0b", vari: "#d97706", nimi: "Päikesekollane" },
            { kere: "#8b5cf6", vari: "#6d28d9", nimi: "Purpurviolett" }
        ];

        // Maailma elemendid
        let teeNihe = 0;
        let linnaNihe = 0;
        let pilved = [
            { x: 80, y: 55, suurus: 1.1, kiirus: 0.3 },
            { x: 380, y: 75, suurus: 0.85, kiirus: 0.25 },
            { x: 670, y: 40, suurus: 1.3, kiirus: 0.35 }
        ];

        // Osakesed (suits ja muusikanoodid)
        let suitsud = [];
        let noodid = [];
        const noodiKujud = ["♪", "♫", "♩", "♬", "❤️"];

        // Hoone andmed taustaks
        const majad = [
            { w: 90, h: 160, varv: "#475569", aknad: 4 },
            { w: 120, h: 220, varv: "#334155", aknad: 6 },
            { w: 75, h: 130, varv: "#64748b", aknad: 3 },
            { w: 110, h: 190, varv: "#475569", aknad: 5 },
            { w: 140, h: 240, varv: "#1e293b", aknad: 7 },
            { w: 85, h: 150, varv: "#334155", aknad: 4 },
            { w: 100, h: 210, varv: "#64748b", aknad: 5 },
            { w: 130, h: 180, varv: "#475569", aknad: 6 },
            { w: 95, h: 230, varv: "#1e293b", aknad: 6 }
        ];
        const majadeKoguLaius = majad.reduce((sum, m) => sum + m.w + 15, 0);

        function tuutu() {
            signaalTaimer = 45;
            for (let i = 0; i < 4; i++) {
                tekitaNoot(true);
            }
        }

        function muudaKiirust() {
            if (kiirus === 5) {
                kiirus = 9;
                document.getElementById("kiirusTekst").innerText = "Turbo! 🚀";
            } else if (kiirus === 9) {
                kiirus = 2;
                document.getElementById("kiirusTekst").innerText = "Kruiisimine 🐢";
            } else {
                kiirus = 5;
                document.getElementById("kiirusTekst").innerText = "Normaalne 🚗";
            }
        }

        function vahetaReziimi() {
            onOo = !onOo;
        }

        function vahetaAutoVarvi() {
            autoVarvIndex = (autoVarvIndex + 1) % autoVarvid.length;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                tuutu();
            }
        });

        function tekitaSuits(x, y) {
            suitsud.push({
                x: x,
                y: y,
                raadius: 7,
                opatsiteet: 0.8,
                vx: -kiirus * 0.7 - Math.random() * 2,
                vy: -0.6 - Math.random() * 0.8
            });
        }

        function tekitaNoot(onSuur = false) {
            noodid.push({
                x: 320 + Math.random() * 30,
                y: 220 + Math.random() * 10,
                tekst: noodiKujud[Math.floor(Math.random() * noodiKujud.length)],
                suurus: onSuur ? 24 + Math.random() * 8 : 16 + Math.random() * 6,
                varv: ["#f43f5e", "#e11d48", "#ec4899", "#8b5cf6", "#f59e0b", "#10b981"][Math.floor(Math.random() * 6)],
                opatsiteet: 1,
                vx: -kiirus * 0.4 - Math.random() * 1.5,
                vy: -1.5 - Math.random() * 1.5,
                rotatsioon: (Math.random() - 0.5) * 0.5
            });
        }

        function animeeri() {
            t++;
            teeNihe = (teeNihe + kiirus) % 80;
            linnaNihe = (linnaNihe + kiirus * 0.3) % majadeKoguLaius;

            joonistaTaevas();

            if (!onOo) {
                joonistaPäike();
            } else {
                joonistaKuu();
            }
            joonistaPilved();

            joonistaLinn();
            joonistaKonnitee();
            joonistaJalakäijad();
            joonistaTee();

            if (t % Math.max(2, Math.floor(6 / (kiirus / 3))) === 0) {
                tekitaSuits(250, 326);
            }
            if (t % 15 === 0) {
                tekitaNoot(false);
            }
            uuendaJaJoonistaSuits();

            joonistaAuto();
            uuendaJaJoonistaNoodid();

            if (signaalTaimer > 0) {
                joonistaSignaaliMull();
                signaalTaimer--;
            }

            requestAnimationFrame(animeeri);
        }

        function joonistaTaevas() {
            let skyGrad = g.createLinearGradient(0, 0, 0, 300);
            if (!onOo) {
                skyGrad.addColorStop(0, "#38bdf8");
                skyGrad.addColorStop(0.6, "#7dd3fc");
                skyGrad.addColorStop(1, "#fef08a");
            } else {
                skyGrad.addColorStop(0, "#090d16");
                skyGrad.addColorStop(0.7, "#1e1b4b");
                skyGrad.addColorStop(1, "#312e81");
            }
            g.fillStyle = skyGrad;
            g.fillRect(0, 0, canvas.width, 300);

            if (onOo) {
                g.fillStyle = "rgba(255, 255, 255, 0.8)";
                for (let i = 0; i < 35; i++) {
                    let starX = (i * 73 + t * 0.05) % canvas.width;
                    let starY = (i * 37) % 150;
                    let r = (i % 3 === 0) ? 2 : 1;
                    g.beginPath();
                    g.arc(starX, starY, r, 0, Math.PI * 2);
                    g.fill();
                }
            }
        }

        function joonistaPäike() {
            let px = 730;
            let py = 80;

            g.strokeStyle = "rgba(251, 191, 36, 0.5)";
            g.lineWidth = 3;
            for (let i = 0; i < 12; i++) {
                let nurk = (i * Math.PI / 6) + t * 0.015;
                g.beginPath();
                g.moveTo(px + Math.cos(nurk) * 45, py + Math.sin(nurk) * 45);
                g.lineTo(px + Math.cos(nurk) * 62, py + Math.sin(nurk) * 62);
                g.stroke();
            }

            let halo = g.createRadialGradient(px, py, 20, px, py, 70);
            halo.addColorStop(0, "rgba(253, 224, 71, 0.9)");
            halo.addColorStop(0.7, "rgba(251, 191, 36, 0.4)");
            halo.addColorStop(1, "rgba(251, 191, 36, 0)");
            g.fillStyle = halo;
            g.beginPath();
            g.arc(px, py, 70, 0, Math.PI * 2);
            g.fill();

            g.fillStyle = "#f59e0b";
            g.beginPath();
            g.arc(px, py, 36, 0, Math.PI * 2);
            g.fill();

            g.fillStyle = "#1e293b";
            g.fillRect(px - 26, py - 8, 22, 14);
            g.fillRect(px + 4, py - 8, 22, 14);
            g.lineWidth = 3;
            g.strokeStyle = "#1e293b";
            g.beginPath();
            g.moveTo(px - 4, py - 3);
            g.lineTo(px + 4, py - 3);
            g.stroke();

            g.strokeStyle = "#78350f";
            g.lineWidth = 3;
            g.beginPath();
            g.arc(px, py + 12, 14, 0.2 * Math.PI, 0.8 * Math.PI);
            g.stroke();
        }

        function joonistaKuu() {
            let kx = 730;
            let ky = 80;

            let halo = g.createRadialGradient(kx, ky, 15, kx, ky, 60);
            halo.addColorStop(0, "rgba(224, 231, 255, 0.8)");
            halo.addColorStop(1, "rgba(224, 231, 255, 0)");
            g.fillStyle = halo;
            g.beginPath();
            g.arc(kx, ky, 60, 0, Math.PI * 2);
            g.fill();

            g.fillStyle = "#e0e7ff";
            g.beginPath();
            g.arc(kx, ky, 32, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = "#1e1b4b";
            g.beginPath();
            g.arc(kx - 12, ky - 6, 26, 0, Math.PI * 2);
            g.fill();
        }

        function joonistaPilved() {
            pilved.forEach(p => {
                p.x -= (p.kiirus + kiirus * 0.08);
                if (p.x < -120) p.x = canvas.width + 60;

                g.fillStyle = onOo ? "rgba(71, 85, 105, 0.45)" : "rgba(255, 255, 255, 0.85)";
                g.beginPath();
                g.arc(p.x, p.y, 22 * p.suurus, 0, Math.PI * 2);
                g.arc(p.x + 20 * p.suurus, p.y - 12 * p.suurus, 28 * p.suurus, 0, Math.PI * 2);
                g.arc(p.x + 50 * p.suurus, p.y, 24 * p.suurus, 0, Math.PI * 2);
                g.arc(p.x + 25 * p.suurus, p.y + 10 * p.suurus, 20 * p.suurus, 0, Math.PI * 2);
                g.fill();
            });
        }

        function joonistaLinn() {
            let startX = -linnaNihe;
            while (startX < canvas.width + 200) {
                let jooksX = startX;
                for (let i = 0; i < majad.length; i++) {
                    let m = majad[i];
                    let my = 270 - m.h;

                    g.fillStyle = onOo ? "#131b2e" : m.varv;
                    g.fillRect(jooksX, my, m.w, m.h);

                    let ridadearv = Math.floor(m.h / 35);
                    for (let r = 0; r < ridadearv; r++) {
                        for (let c = 0; c < 2; c++) {
                            let ax = jooksX + 15 + c * (m.w - 45);
                            let ay = my + 15 + r * 30;

                            if (onOo) {
                                let poleb = (i * 7 + r * 3 + c) % 3 !== 0;
                                g.fillStyle = poleb ? "#fde047" : "#1e293b";
                            } else {
                                g.fillStyle = "#bae6fd";
                            }
                            g.fillRect(ax, ay, 16, 18);
                        }
                    }
                    jooksX += m.w + 15;
                }
                startX = jooksX;
            }
        }

        function joonistaKonnitee() {
            g.fillStyle = onOo ? "#064e3b" : "#22c55e";
            g.fillRect(0, 265, canvas.width, 25);

            g.fillStyle = onOo ? "#334155" : "#cbd5e1";
            g.fillRect(0, 285, canvas.width, 35);

            g.fillStyle = "#94a3b8";
            g.fillRect(0, 315, canvas.width, 5);

            let puuSamm = 240;
            let nihutatudPuu = (teeNihe * 0.7) % puuSamm;
            for (let px = -nihutatudPuu; px < canvas.width + 100; px += puuSamm) {
                g.fillStyle = "#78350f";
                g.fillRect(px + 18, 255, 10, 25);
                g.fillStyle = onOo ? "#047857" : "#16a34a";
                g.beginPath();
                g.arc(px + 23, 245, 24, 0, Math.PI * 2);
                g.arc(px + 10, 250, 16, 0, Math.PI * 2);
                g.arc(px + 36, 250, 16, 0, Math.PI * 2);
                g.fill();
            }

            let laternaX = ((canvas.width + 150) - ((t * kiirus * 0.8) % (canvas.width + 300)));
            joonistaLatern(laternaX, 230);
        }

        function joonistaLatern(lx, ly) {
            g.strokeStyle = "#475569";
            g.lineWidth = 4;
            g.beginPath();
            g.moveTo(lx, ly + 85);
            g.lineTo(lx, ly);
            g.lineTo(lx + 20, ly - 10);
            g.stroke();

            g.fillStyle = onOo ? "#fde047" : "#f1f5f9";
            g.beginPath();
            g.arc(lx + 20, ly - 6, 7, 0, Math.PI * 2);
            g.fill();

            if (onOo) {
                let valguseKiir = g.createRadialGradient(lx + 20, ly - 6, 4, lx + 20, ly + 40, 70);
                valguseKiir.addColorStop(0, "rgba(253, 224, 71, 0.45)");
                valguseKiir.addColorStop(1, "rgba(253, 224, 71, 0)");
                g.fillStyle = valguseKiir;
                g.beginPath();
                g.arc(lx + 20, ly + 20, 60, 0, Math.PI * 2);
                g.fill();
            }
        }

        function joonistaJalakäijad() {
            let inimeneX = ((canvas.width + 250) - ((t * kiirus * 0.85 + 200) % (canvas.width + 450)));
            let inimeneY = 275;

            g.fillStyle = "#ec4899";
            g.fillRect(inimeneX, inimeneY, 14, 24);

            g.fillStyle = "#1e3a8a";
            g.fillRect(inimeneX, inimeneY + 24, 6, 18);
            g.fillRect(inimeneX + 8, inimeneY + 24, 6, 18);

            g.fillStyle = "#fed7aa";
            g.beginPath();
            g.arc(inimeneX + 7, inimeneY - 8, 8, 0, Math.PI * 2);
            g.fill();

            g.fillStyle = "#78350f";
            g.beginPath();
            g.arc(inimeneX + 7, inimeneY - 11, 8, Math.PI, 0);
            g.fill();

            let kaeNurk = Math.sin(t * 0.15) * 0.4;
            g.strokeStyle = "#fed7aa";
            g.lineWidth = 3;
            g.beginPath();
            g.moveTo(inimeneX + 13, inimeneY + 4);
            g.lineTo(inimeneX + 24 + Math.sin(kaeNurk) * 5, inimeneY - 10 + Math.cos(kaeNurk) * 4);
            g.stroke();

            if (inimeneX > 80 && inimeneX < 750) {
                g.fillStyle = "white";
                g.strokeStyle = "#334155";
                g.lineWidth = 1.5;
                g.beginPath();
                g.roundRect(inimeneX + 15, inimeneY - 32, 58, 20, 6);
                g.fill();
                g.stroke();
                g.fillStyle = "#0f172a";
                g.font = "bold 11px sans-serif";
                g.fillText("Tervist! 👋", inimeneX + 20, inimeneY - 18);
            }

            let koerX = inimeneX - 28;
            let koerY = inimeneY + 25;

            g.strokeStyle = "#ef4444";
            g.lineWidth = 1.5;
            g.beginPath();
            g.moveTo(inimeneX, inimeneY + 10);
            g.lineTo(koerX + 14, koerY);
            g.stroke();

            g.fillStyle = "#d97706";
            g.fillRect(koerX, koerY, 20, 12);
            g.fillRect(koerX + 2, koerY + 12, 4, 8);
            g.fillRect(koerX + 14, koerY + 12, 4, 8);
            g.beginPath();
            g.arc(koerX + 22, koerY + 3, 6, 0, Math.PI * 2);
            g.fill();

            let sabaY = Math.sin(t * 0.4) * 5;
            g.strokeStyle = "#d97706";
            g.lineWidth = 3;
            g.beginPath();
            g.moveTo(koerX, koerY + 3);
            g.lineTo(koerX - 8, koerY - 4 + sabaY);
            g.stroke();
        }

        function joonistaTee() {
            g.fillStyle = onOo ? "#0f172a" : "#1e293b";
            g.fillRect(0, 320, canvas.width, 140);

            g.strokeStyle = "#f8fafc";
            g.lineWidth = 4;
            g.beginPath();
            g.moveTo(0, 328);
            g.lineTo(canvas.width, 328);
            g.stroke();

            g.strokeStyle = "#facc15";
            g.lineWidth = 6;
            g.setLineDash([40, 35]);
            g.lineDashOffset = teeNihe * 2;
            g.beginPath();
            g.moveTo(0, 395);
            g.lineTo(canvas.width, 395);
            g.stroke();
            g.setLineDash([]);

            g.strokeStyle = "rgba(255, 255, 255, 0.25)";
            g.lineWidth = 4;
            g.beginPath();
            g.moveTo(0, 452);
            g.lineTo(canvas.width, 452);
            g.stroke();
        }

        function joonistaAuto() {
            let vibratsioon = Math.sin(t * 0.35) * 2;
            let autoX = 260;
            let autoY = 220 + vibratsioon;
            let varv = autoVarvid[autoVarvIndex];

            // Esitulede valgus
            g.save();
            let valgus = g.createRadialGradient(autoX + 240, autoY + 80, 10, autoX + 450, autoY + 100, 240);
            valgus.addColorStop(0, onOo ? "rgba(254, 240, 138, 0.75)" : "rgba(254, 240, 138, 0.35)");
            valgus.addColorStop(1, "rgba(254, 240, 138, 0)");
            g.fillStyle = valgus;
            g.beginPath();
            g.moveTo(autoX + 240, autoY + 68);
            g.lineTo(autoX + 540, autoY + 30);
            g.lineTo(autoX + 540, autoY + 140);
            g.lineTo(autoX + 240, autoY + 95);
            g.closePath();
            g.fill();
            g.restore();

            // 1. Kere
            g.fillStyle = varv.kere;
            g.strokeStyle = "#0f172a";
            g.lineWidth = 3;
            g.beginPath();
            g.roundRect(autoX, autoY + 60, 240, 52, [10, 18, 8, 8]);
            g.fill();
            g.stroke();

            // Rallitriip
            g.fillStyle = "rgba(255, 255, 255, 0.85)";
            g.fillRect(autoX, autoY + 85, 240, 8);

            // Esituli
            g.fillStyle = "#fef08a";
            g.strokeStyle = "#ca8a04";
            g.lineWidth = 2;
            g.fillRect(autoX + 230, autoY + 66, 12, 16);
            g.strokeRect(autoX + 230, autoY + 66, 12, 16);

            // Tagatuli
            g.fillStyle = "#ef4444";
            g.strokeStyle = "#991b1b";
            g.fillRect(autoX - 2, autoY + 66, 8, 16);
            g.strokeRect(autoX - 2, autoY + 66, 8, 16);

            // Stanged
            g.fillStyle = "#cbd5e1";
            g.strokeStyle = "#475569";
            g.lineWidth = 2;
            g.fillRect(autoX - 8, autoY + 98, 10, 12);
            g.strokeRect(autoX - 8, autoY + 98, 10, 12);
            g.fillRect(autoX + 238, autoY + 98, 10, 12);
            g.strokeRect(autoX + 238, autoY + 98, 10, 12);

            // Summuti
            g.fillStyle = "#64748b";
            g.fillRect(autoX - 12, autoY + 104, 12, 6);

            // 2. Katus / kabiin
            g.fillStyle = varv.vari;
            g.strokeStyle = "#0f172a";
            g.lineWidth = 3;
            g.beginPath();
            g.roundRect(autoX + 50, autoY + 10, 120, 52, [14, 14, 0, 0]);
            g.fill();
            g.stroke();

            // 3. Aken
            g.fillStyle = onOo ? "#0369a1" : "#bae6fd";
            g.strokeStyle = "#0f172a";
            g.lineWidth = 2.5;
            g.beginPath();
            g.roundRect(autoX + 62, autoY + 20, 96, 34, [6, 6, 2, 2]);
            g.fill();
            g.stroke();

            // Peegeldused
            g.strokeStyle = "rgba(255, 255, 255, 0.75)";
            g.lineWidth = 2;
            g.beginPath();
            g.moveTo(autoX + 70, autoY + 50);
            g.lineTo(autoX + 90, autoY + 24);
            g.moveTo(autoX + 96, autoY + 50);
            g.lineTo(autoX + 116, autoY + 24);
            g.stroke();

            // Juht
            let peaY = autoY + 34 + Math.sin(t * 0.2) * 2;
            g.fillStyle = "#3b82f6";
            g.fillRect(autoX + 102, autoY + 38, 22, 16);

            g.fillStyle = "#fbcfe8";
            g.beginPath();
            g.arc(autoX + 112, peaY, 9, 0, Math.PI * 2);
            g.fill();

            g.fillStyle = "#ef4444";
