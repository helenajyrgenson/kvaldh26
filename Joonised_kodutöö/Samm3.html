
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Maailma linnade siluetid</title>

  <script>
    let g;

    // Hoonete andmed HTML-faili sees
    // Linn, x, y, laius, kõrgus, värv, aknaread, aknaveerud
    let andmed = [
      ["London", 40, 320, 70, 140, "#4b5563", 4, 2],
      ["London", 130, 320, 60, 170, "#374151", 5, 2],
      ["London", 210, 320, 55, 110, "#6b7280", 3, 2],
      ["London", 280, 320, 40, 200, "#334155", 6, 1],

      ["Pariis", 360, 320, 70, 130, "#6b7280", 4, 2],
      ["Pariis", 440, 320, 60, 150, "#4b5563", 4, 2],
      ["Pariis", 510, 320, 55, 120, "#52525b", 3, 2],

      ["New York", 710, 320, 60, 160, "#52525b", 5, 2],
      ["New York", 780, 320, 70, 210, "#3f3f46", 6, 2],
      ["New York", 860, 320, 40, 130, "#71717a", 4, 1]
    ];

    // Ühe hoone joonistamise funktsioon
    function hoone(x, y, laius, korgus, varv, aknaRead, aknaVeerud) {
      g.fillStyle = varv;
      g.fillRect(x, y - korgus, laius, korgus);

      // Aknad
      g.fillStyle = "#fef3c7";

      let aknaLaius = laius / (aknaVeerud + 1);
      let aknaKorgus = korgus / (aknaRead + 1);

      for (let r = 1; r <= aknaRead; r++) {
        for (let v = 1; v <= aknaVeerud; v++) {
          g.fillRect(
            x + v * aknaLaius - 6,
            y - korgus + r * aknaKorgus - 6,
            12,
            12
          );
        }
      }
    }

    function joonista() {
      g = document.getElementById("tahvel").getContext("2d");

      // Taevas
      g.fillStyle = "#dbeafe";
      g.fillRect(0, 0, 900, 400);

      // Maa
      g.fillStyle = "#d1d5db";
      g.fillRect(0, 320, 900, 80);

      // Joonistame kõik hooned massiivist
      for (let i = 0; i < andmed.length; i++) {
        let d = andmed[i];

        hoone(d[1], d[2], d[3], d[4], d[5], d[6], d[7]);
      }

      // Londoni torni ülemine osa
      g.fillStyle = "#334155";
      g.fillRect(275, 95, 50, 25);

      // Eiffeli torn
      g.strokeStyle = "#1f2937";
      g.beginPath();
      g.moveTo(590, 320);
      g.lineTo(630, 130);
      g.lineTo(670, 320);
      g.closePath();
      g.stroke();

      // New Yorgi torni tipp
      g.fillStyle = "#3f3f46";
      g.fillRect(805, 70, 20, 40);

      // Linnade nimed
      g.fillStyle = "black";
      g.font = "18px Arial";
      g.fillText("London", 100, 360);
      g.fillText("Pariis", 450, 360);
      g.fillText("New York", 760, 360);
    }
  </script>
</head>

<body onload="joonista()">
  <h1>Maailma linnade siluetid</h1>

  <p>Hooned on joonistatud HTML-failis olevate andmete põhjal.</p>

  <canvas id="tahvel" width="900" height="400"></canvas>
</body>
</html>
