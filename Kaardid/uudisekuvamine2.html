<!DOCTYPE html>
<html>
  <head>
    <title>Teated</title>
    <script>
       function loe(){
         fetch("https://script.google.com/macros/s/AKfycbyZeC61d9LE96e-1UWVgMxw-NABX36i_sgrF2Rj0UiB9TvlRj6e_RpT8W-PP6c2LUjt3w/exec"
                ).then(d => d.json()).then(kuva);
       }
       function kuva(tekst){
          console.log(tekst);
          v1.innerText=tekst;
          p1.innerText=tekst[0];
          s1.innerText=tekst[1];
       }
    </script>
  </head>
  <body onload="loe(); setInterval('loe()', 10000)">
    Teade: <span id="v1">teate koht</span>
    <input type="button" value="Kuva teade" onclick="loe()"/>
    <h1 id="p1">Pealkirja koht</h1>
    <div id="s1">sisu koht</div>
  </body>
</html>
