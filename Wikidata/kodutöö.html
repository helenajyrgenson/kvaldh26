
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Filmid Wikidatas</title>

    <style>
        body {
            background-color: #f5efe6;
            font-family: Arial;
            text-align: center;
            color: #3d302b;
            padding: 30px;
        }

        h1 {
            color: #63372c;
            font-size: 38px;
        }

        h2 {
            color: #63372c;
        }

        .kast {
            background-color: #fffaf5;
            padding: 25px;
            margin: 25px auto;
            max-width: 650px;
            border-radius: 15px;
            box-shadow: 0 3px 12px #ddd0c4;
        }

        select, button {
            padding: 12px;
            margin: 7px;
            border: 1px solid #bca99c;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background-color: #63372c;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #916451;
        }

        .film {
            background-color: #f5efe6;
            padding: 13px;
            margin: 10px;
            border-radius: 8px;
        }

        #vastus {
            line-height: 1.6;
        }
    </style>

    <script>
        function kysi1() {
            let zanr = document.getElementById("zanr").value;

            let lause = `
                SELECT ?film ?filmLabel (MIN(?kuupaev) AS ?aasta)
                WHERE
                {
                    ?film wdt:P31 wd:Q11424.
                    ?film wdt:P136 wd:${zanr}.
                    ?film wdt:P577 ?kuupaev.

                    SERVICE wikibase:label {
                        bd:serviceParam wikibase:language "et,en".
                    }
                }
                GROUP BY ?film ?filmLabel
                LIMIT 20
            `;

            let aadress = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause);

            document.getElementById("vastus").innerHTML = "Otsin filme...";

            fetch(aadress).then(d => d.json()).then(kuva1)
            .catch(() => {
                document.getElementById("vastus").textContent = "Päring ebaõnnestus. Proovi uuesti.";
            });
        }

        function kysi2() {
            let zanr = document.getElementById("zanr").value;

            let lause = `
                SELECT DISTINCT ?film ?filmLabel ?lavastajaLabel
                WHERE
                {
                    ?film wdt:P31 wd:Q11424.
                    ?film wdt:P136 wd:${zanr}.
                    ?film wdt:P57 ?lavastaja.

                    SERVICE wikibase:label {
                        bd:serviceParam wikibase:language "et,en".
                    }
                }
                LIMIT 20
            `;

            let aadress = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause);

            document.getElementById("vastus").innerHTML = "Otsin režissööre...";

            fetch(aadress).then(d => d.json()).then(kuva2)
            .catch(() => {
                document.getElementById("vastus").textContent = "Päring ebaõnnestus. Proovi uuesti.";
            });
        }

        function kuva1(d) {
            console.log(d);
            let vastus = document.getElementById("vastus");
            vastus.innerHTML = "<h2>Leitud filmid</h2>";

            for (let rida of d["results"]["bindings"]) {
                let lause = document.createElement("div");
                lause.className = "film";

                let nimi = rida["filmLabel"]["value"];
                let kuupaev = rida["aasta"]["value"].substring(0, 10);

                lause.textContent = nimi + " - " + kuupaev;
                vastus.appendChild(lause);
            }
        }

        function kuva2(d) {
            console.log(d);
            let vastus = document.getElementById("vastus");
            vastus.innerHTML = "<h2>Filmid ja režissöörid</h2>";

            for (let rida of d["results"]["bindings"]) {
                let lause = document.createElement("div");
                lause.className = "film";

                let nimi = rida["filmLabel"]["value"];
                let lavastaja = rida["lavastajaLabel"]["value"];

                lause.textContent = nimi + " - " + lavastaja;
                vastus.appendChild(lause);
            }
        }
    </script>
</head>

<body>

    <h1>Filmid Wikidatas</h1>
    <p>Erinevate filmide žanrid ja nende režissöörid</p>

    <div class="kast">
        <h2>Filmiotsing</h2>

        <p>Vali endale huvipakkuv filmižanr:</p>

        <select id="zanr">
            <option value="Q157394">Fantaasia</option>
            <option value="Q471839">Ulme</option>
            <option value="Q200092">Õudus</option>
            <option value="Q157443">Komöödia</option>
        </select>

        <p>
            <button onclick="kysi1()">Otsi filme</button>
            <button onclick="kysi2()">Otsi režissööre</button>
        </p>
    </div>

    <div class="kast">
        <div id="vastus">
            Vali žanr ja vajuta otsingunuppu!
        </div>
    </div>

    <p>Andmed pärinevad Wikidata andmebaasist.</p>

</body>
</html>
